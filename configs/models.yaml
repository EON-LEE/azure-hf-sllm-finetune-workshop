    context_length: 131072
    license: mit
    commercial_use: true
    korean_tier: moderate
    korean_notes: >-
      200K vocabulary is a big improvement over Phi-3 for Hangul, and Microsoft
      claims 22-language support, but no per-language Korean numbers are
      published and community comparisons put Qwen ahead on Korean/CJK.
    vram_gb:
      qlora: 7
      lora: 14
      full: 64
    recommended_sku: Standard_NC24ads_A100_v4
    notes: >-
      The only model here that is fine-tunable BOTH via our own HF training loop
      and via Foundry serverless SFT, so it is the natural A/B test between the
      two backends.
    source_url: https://huggingface.co/microsoft/Phi-4-mini-instruct


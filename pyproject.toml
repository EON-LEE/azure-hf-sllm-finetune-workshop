[project]
name = "ffsft"
version = "0.1.0"
description = "Fabric + Azure AI Foundry + Hugging Face: swappable small-LLM (sLLM) fine-tuning asset, Korean-first"
readme = "README.md"
# 3.10 is the floor because Azure ML's curated deep-learning images (aifx/acpt/*)
# ship Python 3.10 and there is no newer ACPT tag; the training container is built
# on one of those, so the package has to import there.
requires-python = ">=3.10"
license = { text = "MIT" }

# Core stays light so that `uv sync` works on a laptop with no GPU.
# Heavy training/eval deps live in optional extras.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "azure-identity>=1.17",
]

[project.optional-dependencies]
# Data prep + pulling datasets from Hugging Face / OneLake
data = [
    "datasets>=4.8",
    "huggingface-hub>=0.35",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "azure-storage-file-datalake>=12.15",
]

# Local / VM GPU training with Hugging Face stack.
# transformers>=5.8 is a hard floor: Qwen3.5/3.6/3.8 checkpoints declare
# `model_type: qwen3_5` and were saved with transformers 5.8.0.dev0. Older
# releases fail to load them with a KeyError on the model type.
# torch's floor is 2.8 rather than something newer on purpose: the Azure ML
# training image is built on ACPT, which validates torch 2.8.0+cu126 against the
# AmlCompute drivers, and raising the floor here would make the image's own
# constraint file unsatisfiable.
train = [
    "torch>=2.8",
    "transformers>=5.8",
    "trl>=1.10",
    "peft>=0.20",
    "accelerate>=1.14",
    "bitsandbytes>=0.50",
    "sentencepiece>=0.2",
    "datasets>=4.8",
]

# Azure ML / Foundry job submission, deployment, evaluation
azure = [
    "azure-ai-ml>=1.19",
    "azure-ai-projects>=1.0.0b1",
    "azure-ai-evaluation>=1.0.0b1",
    "azure-core>=1.30",
    "openai>=1.40",
    "requests>=2.32",
]

# Korean benchmark evaluation. lm-eval is pinned to >=0.4.5 because that is the
# first release whose HFLM accepts `peft=` alongside `load_in_4bit=`, which is
# what lets us score the adapter in the same NF4 configuration it was trained in.
eval = [
    "lm-eval>=0.4.5",
    "scipy>=1.13",
    "mlflow>=2.16",
]

# Client-side load testing. Intentionally tiny and GPU-free: the load generator
# must be runnable from a laptop against a remote endpoint.
serve = [
    "httpx>=0.27",
]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
ffsft = "ffsft.cli:app"
ffsft-lifecycle = "ffsft.deploy.lifecycle:main"
ffsft-loadtest = "ffsft.serve.loadtest:main"
ffsft-eval = "ffsft.eval.run:main"
ffsft-merge = "ffsft.deploy.merge:main"
ffsft-deploy = "ffsft.deploy.endpoint:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fabric notebooks bootstrap sys.path before importing ffsft, and the Spark
# runtime injects `display` as a builtin, so neither rule can be satisfied here.
"notebooks/fabric/*.py" = ["E402", "F821"]
